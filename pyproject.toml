[project]
name = "openai-apis"
version = "0.1.0"
description = "Unified OpenAI API interfaces for voice and text interactions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "websockets>=12.0",
    "python-dotenv>=0.21.0",
]

[project.optional-dependencies]
audio = ["sounddevice>=0.5.3", "numpy>=2.4.0", "websocket-client>=1.5.0"]
web = ["fastapi", "uvicorn", "python-multipart", "aiofiles"]
agents = ["openai-agents"]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0", "pytest-cov>=4.0.0", "httpx"]
all = ["openai-apis[audio,web,agents]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--strict-markers --cov=openai_apis --cov-report=term-missing"

[tool.coverage.run]
source = ["openai_apis"]
omit = ["*/tests/*", "*/examples/*"]

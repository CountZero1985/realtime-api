[project]
name = "openai-apis"
version = "0.1.0"
description = "Unified OpenAI API interfaces for voice and text interactions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=0.21.0",
    "numpy>=2.4.0",
    "sounddevice>=0.5.3",
    "websocket-client>=1.5.0",
    "openai-agents",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--strict-markers --cov=openai_apis --cov-report=term-missing"

[tool.coverage.run]
source = ["openai_apis"]
omit = ["*/tests/*", "*/examples/*"]
